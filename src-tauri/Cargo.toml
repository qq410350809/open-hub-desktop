[package]
name = "ld-open-hub-desktop"
version = "0.3.0"
description = "Local website library built with Tauri"
authors = ["OpenHub"]
edition = "2021"

[lib]
name = "ld_open_hub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

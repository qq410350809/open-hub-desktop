<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AppTable Debug</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, ref } from "vue";
      import AppTable from "./src/components/AppTable.vue";
      import "./src/styles.css";

      const columns = [
        { key: "label", title: "时间", width: "minmax(120px,1fr)" },
        { key: "total", title: "总计", width: "90px", align: "right", sortable: true },
        { key: "input", title: "输入", width: "90px", align: "right", sortable: true },
        { key: "output", title: "输出", width: "90px", align: "right", sortable: true },
        { key: "cache", title: "缓存", width: "90px", align: "right", sortable: true },
        { key: "cacheHitRate", title: "缓存命中率", width: "110px", align: "right", sortable: true },
        { key: "reasoning", title: "推理", width: "90px", align: "right", sortable: true },
        { key: "sessions", title: "对话", width: "90px", align: "right", sortable: true },
      ];

      const rows = ref(
        Array.from({ length: 12 }, (_, index) => ({
          id: index,
          label: `2026-08-${String(index + 1).padStart(2, "0")} 12:34`,
          total: 12345678 + index * 999,
          input: 8000000 + index * 700,
          output: 4000000 + index * 300,
          cache: 3000000 + index * 100,
          cacheHitRate: 0.83 + index * 0.01,
          reasoning: 200000 + index * 50,
          sessions: 42 + index,
        })),
      );

      createApp({
        setup() {
          return { columns, rows };
        },
        template: `
          <div style="padding: 32px; min-height: 100vh; box-sizing: border-box;">
            <div style="height: 460px;">
              <AppTable :rows="rows" :columns="columns" :page-size="8" show-pagination />
            </div>
          </div>
        `,
      })
        .component("AppTable", AppTable)
        .mount("#app");
    </script>
  </body>
</html>

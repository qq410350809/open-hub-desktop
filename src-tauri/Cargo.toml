[package]
name = "open-hub-desktop"
version = "0.3.0"
description = "Local website library built with Tauri"
authors = ["OpenHub"]
edition = "2021"

# 两个二进制共存时，cargo run 需要明确默认目标（tauri dev 走桌面形态）。
default-run = "open-hub-desktop"

# 仅保留 rlib：staticlib/cdylib 只服务于 Tauri 移动端打包（本项目无移动端），
# 却会让每次 dev 构建多生成 265MB 的 .a 和 .dylib，拖慢收尾的链接/归档步骤。
[lib]
name = "open_hub_desktop_lib"
crate-type = ["rlib"]

# 双形态构建：
# - desktop（默认）：Tauri 桌面壳 + 内嵌服务，产物为常规桌面应用
# - server：无 Tauri 依赖的独立单文件 HTTP 服务（openhub-server）
[features]
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-opener",
    "dep:font-kit",
    "dep:rfd",
    "dep:tauri-build",
]
server = []

[[bin]]
name = "open-hub-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "openhub-server"
path = "src/bin/server.rs"
required-features = ["server"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
font-kit = { version = "0.14.3", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "http2", "stream", "gzip", "deflate", "brotli"] }
# 站点同步直连客户端：模拟 Chrome TLS/JA3/HTTP2 指纹，配合浏览器 Cookie（含 cf_clearance）
# 通过 Cloudflare 安全盾，替代 AppleEvent 浏览器桥接的大部分场景。
wreq = { version = "0.15.3", features = ["json", "stream", "gzip", "deflate", "brotli", "socks"] }
wreq-util = "0.1.0"
quick-xml = { version = "0.39.4", features = ["serialize"] }
serde_yaml = "0.9"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
bytes = "1"
flate2 = "1.0"
zip = { version = "2", default-features = false, features = ["deflate"] }

percent-encoding = "2"
libc = { version = "0.2" }

# macOS 托盘唤起后修复窗口交通灯（tao TransformProcessType 会置 canHide=false）。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

maxminddb = "0.30"
rfd = { version = "0.17", optional = true }
futures-util = "0.3"
tokio-util = "0.7"
tokio = { version = "1", features = ["time", "rt", "rt-multi-thread", "macros", "sync", "net", "io-util"] }
axum = "0.8"
async-stream = "0.3"
tower-http = { version = "0.6", features = ["cors", "fs"] }
zstd = "0.13"
genai = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }

# 开发编译体积优化：减少 debug 信息层级，避免 deps 目录无限膨胀。
[profile.dev]
debug = "line-tables-only"
# strip 不影响 dev（链接器仅对 release 生效），但减少 .a/二进制体积
strip = "none"

[profile.dev.package."*"]
debug = false
opt-level = 0

# release 更激进瘦身
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[package]
name = "open-hub-desktop"
version = "0.3.0"
description = "Local website library built with Tauri"
authors = ["OpenHub"]
edition = "2021"

[lib]
name = "open_hub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
font-kit = "0.14.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls"] }
quick-xml = { version = "0.39.4", features = ["serialize"] }
serde_yaml = "0.9"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

percent-encoding = "2"
maxminddb = "0.30"
futures-util = "0.3"
tokio-util = "0.7"
tokio = { version = "1", features = ["time", "rt", "rt-multi-thread", "macros", "sync"] }

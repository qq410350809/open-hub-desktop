[package]
name = "open-hub-desktop"
version = "0.3.0"
description = "Local website library built with Tauri"
authors = ["OpenHub"]
edition = "2021"

[lib]
name = "open_hub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
font-kit = "0.14.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "http2", "stream", "gzip", "deflate", "brotli"] }
quick-xml = { version = "0.39.4", features = ["serialize"] }
serde_yaml = "0.9"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
bytes = "1"
flate2 = "1.0"

percent-encoding = "2"
libc = "0.2"
maxminddb = "0.30"
rfd = "0.17"
futures-util = "0.3"
tokio-util = "0.7"
tokio = { version = "1", features = ["time", "rt", "rt-multi-thread", "macros", "sync", "net", "io-util"] }
axum = "0.8"
async-stream = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
zstd = "0.13"
genai = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }

# 开发编译体积优化：减少 debug 信息层级，避免 deps 目录无限膨胀。
[profile.dev]
debug = "line-tables-only"
# strip 不影响 dev（链接器仅对 release 生效），但减少 .a/二进制体积
strip = "none"

[profile.dev.package."*"]
debug = false
opt-level = 0

# release 更激进瘦身
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
